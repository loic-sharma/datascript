name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Debug info for DataFusion's dependency tree fills the Linux runner's disk and crashes the
  # linker (bus error). CI never needs a debugger, so drop it; this also shrinks the cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: test datascript-datafusion without compression
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p datascript-datafusion --no-default-features

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: cargo build -p datascript-cli
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:grammar
      # VS Code needs a display.
      - run: xvfb-run -a npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: datascript-vsix
          path: editors/vscode/*.vsix

  wasm:
    name: wasm32 check (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo check --target wasm32-unknown-unknown
          -p datascript-diagnostics -p datascript-syntax -p datascript-compiler

  wasm-datafusion:
    name: wasm32 check (datascript-datafusion)
    runs-on: ubuntu-latest
    env:
      # zstd-sys compiles C; Apple's clang has no wasm32 backend, but the runner's clang does
      # (docs/spikes/datafusion-wasm.md).
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
      # RUSTFLAGS replaces the target rustflags in .cargo/config.toml, so repeat the getrandom
      # backend here.
      RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The `llvm` package provides the unversioned `llvm-ar`.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: >-
          cargo check -p datascript-datafusion --no-default-features --features wasm
          --target wasm32-unknown-unknown
