[package]
name = "datascript-lsp"
description = "The DataScript language server (`ds lsp`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
datascript-compiler = { path = "../datascript-compiler" }
datascript-diagnostics = { path = "../datascript-diagnostics" }
datascript-engine = { path = "../datascript-engine" }
datascript-syntax = { path = "../datascript-syntax" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
tower-lsp-server.workspace = true

[dev-dependencies]
arrow-schema.workspace = true
async-trait.workspace = true
datascript-datafusion = { path = "../datascript-datafusion" }
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
