[package]
name = "datascript-engine"
description = "Engine abstraction, result model and session facade for DataScript."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-cast.workspace = true
# `ds run --format arrow` and the shared printer (`printer`).
arrow-ipc.workspace = true
async-trait.workspace = true
datascript-compiler = { path = "../datascript-compiler" }
datascript-diagnostics = { path = "../datascript-diagnostics" }
futures.workspace = true
# `preserve_order` keeps JSON row objects in column order (`writers`).
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }

[lints]
workspace = true
