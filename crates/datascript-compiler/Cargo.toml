[package]
name = "datascript-compiler"
description = "Binder, type system, function catalog and logical plan IR for DataScript."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow-schema = { workspace = true, features = ["serde"] }
datascript-diagnostics = { path = "../datascript-diagnostics" }
datascript-syntax = { path = "../datascript-syntax" }
# Checks constant regular expressions at check time (D-014); the parser only, not the engine.
regex-syntax.workspace = true
serde = { workspace = true, features = ["rc"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
