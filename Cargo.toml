[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# External crates (DataFusion stays out until M1-08)
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1"
# Arrow must match the version DataFusion uses (DataFusion 55 -> arrow 59), see M1-08.
arrow-array = "59"
arrow-schema = "59"
arrow-cast = { version = "59", default-features = false }
# Only the fixture generator writes Parquet for now; M1-08 reads it through DataFusion.
parquet = { version = "59", default-features = false, features = ["arrow"] }
libtest-mimic = "0.8"
similar = "3"
proptest = "1"
rowan = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
